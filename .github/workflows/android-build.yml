name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AndroidDesk
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            AndroidDesk/**/*.gradle.kts
            AndroidDesk/gradle.properties
            AndroidDesk/gradle/libs.versions.toml
            AndroidDesk/gradle/wrapper/gradle-wrapper.properties

      - name: Verify Android SDK 35
        id: sdk
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Run JVM unit tests
        run: ./gradlew testAll

      - name: Assemble debug APK
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: ./gradlew :app:assembleDebug

      - name: Run Android Lint
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: ./gradlew :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-desk-debug
          path: AndroidDesk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
